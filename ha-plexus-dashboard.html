<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Home Assistant 3D Plexus Ambient Dashboard</title>
  <style>
    :root {
      --bg-top: #0b1020;
      --bg-mid: #151c30;
      --bg-bot: #070b15;
      --text-main: rgba(241, 245, 249, 0.94);
      --text-muted: rgba(148, 163, 184, 0.74);
      --cyan: #67e8f9;
      --card-bg: rgba(12, 19, 36, 0.78);
      --card-border: rgba(165, 216, 255, 0.24);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 45%, var(--bg-mid) 0%, var(--bg-top) 55%, var(--bg-bot) 100%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
    }

    #sphere-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }
    #sphere-canvas:active { cursor: grabbing; }

    .clock-header {
      position: relative;
      z-index: 10;
      margin-top: clamp(28px, 6vh, 72px);
      text-align: center;
      pointer-events: none;
    }

    .clock-time {
      font-size: clamp(3.2rem, 8.5vw, 5.5rem);
      font-weight: 200;
      letter-spacing: 0.04em;
      line-height: 1.05;
      color: rgba(248, 250, 252, 0.92);
      text-shadow: 0 0 28px rgba(103, 232, 249, 0.16);
      font-variant-numeric: tabular-nums;
    }

    .clock-date {
      margin-top: 8px;
      font-size: clamp(0.95rem, 2.2vw, 1.25rem);
      font-weight: 300;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .wake-beam {
      position: absolute;
      left: 50%;
      bottom: clamp(230px, 34vh, 330px);
      width: 0%;
      height: 2px;
      transform: translateX(-50%);
      background: linear-gradient(90deg, transparent 0%, rgba(103, 232, 249, 0.85) 25%, #ffffff 50%, rgba(103, 232, 249, 0.85) 75%, transparent 100%);
      box-shadow: 0 0 18px 3px rgba(103, 232, 249, 0.75);
      opacity: 0;
      pointer-events: none;
      z-index: 18;
    }

    .wake-beam.firing { animation: beamSweep 0.95s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    @keyframes beamSweep {
      0%   { width: 0%; opacity: 0; }
      25%  { width: min(88%, 540px); opacity: 1; }
      70%  { width: min(94%, 600px); opacity: 0.85; }
      100% { width: min(100%, 640px); opacity: 0; }
    }

    .assist-wrapper {
      position: relative;
      z-index: 20;
      width: min(90vw, 460px);
      margin-bottom: clamp(26px, 5.5vh, 56px);
      pointer-events: none;
    }

    .assist-card {
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px 24px 22px;
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        0 0 32px rgba(103, 232, 249, 0.08);
      opacity: 0;
      transform: translateY(34px) scale(0.97);
      transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1), transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }

    .assist-card.visible { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }

    .assist-source {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 6px;
    }

    .assist-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 10px var(--cyan);
      animation: pulseDot 1.6s infinite ease-in-out;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 0.5; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.25); }
    }

    .assist-transcript { font-size: 1.05rem; color: rgba(241, 245, 249, 0.92); min-height: 1.5em; margin-bottom: 16px; }
    .assist-body { border-top: 1px solid rgba(148, 163, 184, 0.14); padding-top: 16px; }

    .light-widget { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 6px 0 2px; }
    .bulb-wrap { position: relative; width: 66px; height: 66px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
    .bulb-halo {
      position: absolute; inset: -10px; border-radius: 50%;
      background: radial-gradient(circle, rgba(254, 240, 138, 0.45) 0%, rgba(250, 204, 21, 0.12) 45%, transparent 72%);
      opacity: 0; transform: scale(0.6); transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .light-widget.is-on .bulb-halo { opacity: 1; transform: scale(1.15); }
    .bulb-svg { width: 48px; height: 48px; position: relative; z-index: 2; transition: filter 0.7s ease; }
    .bulb-glass { fill: rgba(254, 240, 138, 0); stroke: rgba(148, 163, 184, 0.65); stroke-width: 1.6; transition: fill 0.7s ease, stroke 0.7s ease; }
    .light-widget.is-on .bulb-glass { fill: rgba(254, 249, 195, 0.92); stroke: #fef08a; }
    .light-widget.is-on .bulb-svg { filter: drop-shadow(0 0 12px rgba(254, 240, 138, 0.75)); }
    .light-title { font-size: 1.08rem; font-weight: 500; }
    .light-sub { margin-top: 4px; font-size: 0.86rem; color: var(--text-muted); }
    .light-widget.is-on .light-sub { color: #fde68a; }

    .weather-main { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 16px; }
    .weather-left { display: flex; align-items: center; gap: 14px; }
    .weather-icon-lg { width: 54px; height: 54px; filter: drop-shadow(0 0 12px rgba(103, 232, 249, 0.35)); }
    .weather-cond { font-size: 0.74rem; font-weight: 600; letter-spacing: 0.16em; color: var(--cyan); text-transform: uppercase; }
    .weather-temp { font-size: 2.35rem; font-weight: 200; line-height: 1.05; }
    .weather-stats { text-align: right; font-size: 0.8rem; line-height: 1.55; color: var(--text-muted); }
    .weather-forecast { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding-top: 12px; border-top: 1px solid rgba(148, 163, 184, 0.12); }
    .fc-day { text-align: center; padding: 6px 4px; border-radius: 10px; background: rgba(255, 255, 255, 0.03); }
    .fc-name { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 4px; }
    .fc-ico { font-size: 1.05rem; margin-bottom: 3px; }
    .fc-val { font-size: 0.82rem; font-weight: 500; }

    .general-widget { display: flex; align-items: flex-start; gap: 14px; padding: 4px 0; }
    .general-badge {
      width: 38px; height: 38px; border-radius: 12px;
      background: rgba(103, 232, 249, 0.12); border: 1px solid rgba(103, 232, 249, 0.3);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--cyan);
    }
    .general-text { font-size: 0.94rem; line-height: 1.5; color: rgba(226, 232, 240, 0.9); }

    .demo-dock {
      position: fixed; right: 16px; bottom: 14px; z-index: 40;
      display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px;
      background: rgba(10, 16, 30, 0.55); border: 1px solid rgba(148, 163, 184, 0.16);
      backdrop-filter: blur(10px); opacity: 0.32; transition: opacity 0.25s ease;
    }
    .demo-dock:hover { opacity: 0.98; }
    .demo-btn {
      background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e2e8f0; font-size: 0.72rem; padding: 5px 10px; border-radius: 999px; cursor: pointer;
    }
    .demo-btn:hover { background: rgba(103, 232, 249, 0.18); border-color: rgba(103, 232, 249, 0.45); }

    .status-pill {
      position: fixed; left: 16px; bottom: 16px; z-index: 40;
      font-size: 0.68rem; letter-spacing: 0.08em; color: rgba(148, 163, 184, 0.5);
      display: flex; align-items: center; gap: 6px; pointer-events: none;
    }
    .status-led { width: 6px; height: 6px; border-radius: 50%; background: #38bdf8; }
    .status-led.live { background: #4ade80; box-shadow: 0 0 8px #4ade80; }
  </style>
</head>
<body>
  <div class="stage">
    <header class="clock-header">
      <div class="clock-time" id="clock-time">--:--</div>
      <div class="clock-date" id="clock-date"></div>
    </header>
    <canvas id="sphere-canvas"></canvas>
    <div class="wake-beam" id="wake-beam"></div>
    <section class="assist-wrapper">
      <div class="assist-card" id="assist-card">
        <div class="assist-source">
          <span class="assist-dot"></span>
          <span id="assist-source-label">AI / LIVING ROOM</span>
        </div>
        <div class="assist-transcript" id="assist-transcript"></div>
        <div class="assist-body" id="assist-body"></div>
      </div>
    </section>
  </div>

  <div class="status-pill">
    <span class="status-led" id="status-led"></span>
    <span id="status-text">DEMO MODE · Keys 1 / 2 / 3</span>
  </div>

  <div class="demo-dock">
    <button class="demo-btn" onclick="triggerDemoLight()">1 開燈</button>
    <button class="demo-btn" onclick="triggerDemoWeather()">2 天氣</button>
    <button class="demo-btn" onclick="triggerDemoGeneral()">3 語音</button>
    <button class="demo-btn" onclick="hideAssistCard()">待機</button>
  </div>

  <script>
    /* ============================================================
     * 1. Home Assistant 設定區（已對應本宅實際實體；留空 Token 即為 Demo 模式）
     * ============================================================ */
    const CONFIG = {
      HA_URL: "", // 例如 "http://homeassistant.local:8123" 或 Nabu Casa URL
      HA_TOKEN: "", // HA 長期存取權杖 (Long-Lived Access Token)
      ASSIST_EVENT: "assist_dashboard_event",
      NODE_COUNT: 86,
      CONNECTION_DIST: 0.62,
      AUTO_ROTATE_SPEED: 0.0022,
      OVERLAY_TIMEOUT_MS: 6800,
      entities: [
        { id: "sensor.wen_shi_du_hong_wai_xian_yao_kong_qi_temperature", label: "餐廳溫度", value: "22.6°C", color: "#67e8f9", lat:  0.50, lon:  0.35 },
        { id: "sensor.wen_shi_du_hong_wai_xian_yao_kong_qi_humidity",    label: "餐廳濕度", value: "64%",    color: "#7dd3fc", lat: -0.18, lon: -1.45 },
        { id: "climate.dyson_9ht_tw_uga2354a",                           label: "Dyson",    value: "26.2°C", color: "#67e8f9", lat: -0.56, lon: -0.92 },
        { id: "switch.zhi_neng_kai_guan_4_switch",                       label: "燈光",     value: "1 開啟", color: "#fde68a", lat:  0.38, lon:  1.45 },
        { id: "media_player.ke_ting_de_dian_shi_2",                      label: "客廳電視", value: "待機",   color: "#cbd5e1", lat: -0.34, lon:  1.15 },
        { id: "humidifier.xiao_qing",                                    label: "小清除濕", value: "運轉 49%", color: "#a5f3fc", lat: -0.24, lon: 0.22 }
      ]
    };

    class HomeAssistantClient {
      constructor({ url, token, assistEvent, onConnected, onDisconnected, onState, onAssist }) {
        this.url = url;
        this.token = token;
        this.assistEvent = assistEvent;
        this.onConnected = onConnected;
        this.onDisconnected = onDisconnected;
        this.onState = onState;
        this.onAssist = onAssist;
        this.ws = null;
        this.msgId = 1;
      }

      connect() {
        if (!this.url || !this.token) return false;
        const wsUrl = this.url.replace(/^http/, "ws").replace(/\/$/, "") + "/api/websocket";
        this.ws = new WebSocket(wsUrl);
        this.ws.onmessage = (ev) => {
          const msg = JSON.parse(ev.data);
          if (msg.type === "auth_required") {
            this.ws.send(JSON.stringify({ type: "auth", access_token: this.token }));
          } else if (msg.type === "auth_ok") {
            this.onConnected?.();
            this.ws.send(JSON.stringify({ id: this.msgId++, type: "get_states" }));
            this.ws.send(JSON.stringify({ id: this.msgId++, type: "subscribe_events", event_type: "state_changed" }));
            this.ws.send(JSON.stringify({ id: this.msgId++, type: "subscribe_events", event_type: this.assistEvent }));
          } else if (msg.type === "result" && Array.isArray(msg.result)) {
            msg.result.forEach((s) => this.onState?.(s, false));
          } else if (msg.type === "event") {
            if (msg.event.event_type === "state_changed" && msg.event.data?.new_state) {
              this.onState?.(msg.event.data.new_state, true);
            } else if (msg.event.event_type === this.assistEvent) {
              this.onAssist?.(msg.event.data || {});
            }
          }
        };
        this.ws.onclose = () => {
          this.onDisconnected?.();
          setTimeout(() => this.connect(), 5000);
        };
        return true;
      }
    }

    function updateClock() {
      const now = new Date();
      document.getElementById("clock-time").textContent =
        `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
      const weekday = now.toLocaleDateString("en-US", { weekday: "long" });
      const month = now.toLocaleDateString("en-US", { month: "long" });
      document.getElementById("clock-date").textContent = `${weekday} ${now.getDate()} ${month}`;
    }
    updateClock();
    setInterval(updateClock, 10000);

    const canvas = document.getElementById("sphere-canvas");
    const ctx = canvas.getContext("2d");
    let width = 0, height = 0, dpr = 1, sphereRadius = 180;
    let targetCenterYOffset = 0, currentCenterYOffset = 0, targetSphereScale = 1.0, currentSphereScale = 1.0;
    let rotY = 0.4, rotX = 0.18, velY = 0, velX = 0, isDragging = false, lastPointerX = 0, lastPointerY = 0, lastInteractTime = 0;
    const nodes = [], edges = [], pulses = [], comets = [], bgStars = [];
    let highlightEntityId = null, highlightUntil = 0, animFrameId = null, lastPulseTime = 0;

    function initGeometry() {
      const N = CONFIG.NODE_COUNT;
      const goldenAngle = Math.PI * (3 - Math.sqrt(5));
      for (let i = 0; i < N; i++) {
        const y = 1 - (i / (N - 1)) * 2;
        const r = Math.sqrt(Math.max(0, 1 - y * y));
        const theta = goldenAngle * i;
        const jitterR = 0.90 + Math.random() * 0.16;
        const x = Math.cos(theta) * r + (Math.random() - 0.5) * 0.14;
        const yy = y + (Math.random() - 0.5) * 0.14;
        const z = Math.sin(theta) * r + (Math.random() - 0.5) * 0.14;
        const len = Math.hypot(x, yy, z) || 1;
        nodes.push({ x: (x / len) * jitterR, y: (yy / len) * jitterR, z: (z / len) * jitterR, size: 1.5 + Math.random() * 1.4 });
      }
      for (let i = 0; i < nodes.length; i++) {
        let connections = 0;
        for (let j = i + 1; j < nodes.length; j++) {
          const d = Math.hypot(nodes[i].x - nodes[j].x, nodes[i].y - nodes[j].y, nodes[i].z - nodes[j].z);
          if (d < CONFIG.CONNECTION_DIST && connections < 6) { edges.push({ a: i, b: j }); connections++; }
        }
      }
      [
        { radius: 1.18, tiltX:  0.65, tiltZ:  0.35, speed:  0.011, angle: 0.4, tailLen: 0.72 },
        { radius: 1.24, tiltX: -0.82, tiltZ:  0.90, speed: -0.0085, angle: 2.3, tailLen: 0.65 },
        { radius: 1.20, tiltX:  1.15, tiltZ: -0.55, speed:  0.0095, angle: 4.1, tailLen: 0.58 },
        { radius: 1.28, tiltX: -0.32, tiltZ: -1.10, speed:  0.0072, angle: 5.2, tailLen: 0.60 }
      ].forEach((c) => comets.push(c));
      for (let i = 0; i < 48; i++) bgStars.push({ x: Math.random(), y: Math.random(), r: 0.5 + Math.random() * 1.1, a: 0.08 + Math.random() * 0.22 });
    }

    function rotatePoint(x, y, z, rx, ry) {
      const cosY = Math.cos(ry), sinY = Math.sin(ry);
      const x1 = x * cosY - z * sinY, z1 = x * sinY + z * cosY;
      const cosX = Math.cos(rx), sinX = Math.sin(rx);
      return { x: x1, y: y * cosX - z1 * sinX, z: y * sinX + z1 * cosX };
    }

    function project(p, cx, cy, R) {
      const fov = 3.2, scale = fov / (fov - p.z);
      return { sx: cx + p.x * R * scale, sy: cy + p.y * R * scale, z: p.z, scale };
    }

    function spawnPulse(count = 1) {
      for (let k = 0; k < count; k++) {
        const edge = edges[Math.floor(Math.random() * edges.length)];
        pulses.push({ edge, t: 0, speed: 0.022 + Math.random() * 0.025, reverse: Math.random() > 0.5 });
      }
    }

    function resizeCanvas() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth; height = window.innerHeight;
      canvas.width = Math.floor(width * dpr); canvas.height = Math.floor(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      sphereRadius = Math.min(width * 0.34, height * 0.23, 225);
    }
    window.addEventListener("resize", resizeCanvas);

    canvas.addEventListener("pointerdown", (e) => { isDragging = true; lastPointerX = e.clientX; lastPointerY = e.clientY; lastInteractTime = performance.now(); canvas.setPointerCapture(e.pointerId); });
    canvas.addEventListener("pointermove", (e) => {
      if (!isDragging) return;
      velY = (e.clientX - lastPointerX) * 0.0055; velX = (e.clientY - lastPointerY) * 0.0055;
      lastPointerX = e.clientX; lastPointerY = e.clientY;
      rotY += velY; rotX = Math.max(-1.2, Math.min(1.2, rotX + velX)); lastInteractTime = performance.now();
    });
    canvas.addEventListener("pointerup", () => { isDragging = false; });
    canvas.addEventListener("pointercancel", () => { isDragging = false; });

    function render(now) {
      ctx.clearRect(0, 0, width, height);
      currentCenterYOffset += (targetCenterYOffset - currentCenterYOffset) * 0.07;
      currentSphereScale += (targetSphereScale - currentSphereScale) * 0.07;
      const cx = width * 0.5, cy = height * 0.50 + currentCenterYOffset, R = sphereRadius * currentSphereScale;

      if (!isDragging) {
        velY *= 0.94; velX *= 0.94; rotY += velY; rotX += velX;
        if (now - lastInteractTime > 1600) { rotY += CONFIG.AUTO_ROTATE_SPEED; rotX += (Math.sin(now * 0.00035) * 0.22 - rotX) * 0.008; }
      }

      for (const s of bgStars) { ctx.fillStyle = `rgba(186, 230, 253, ${s.a})`; ctx.beginPath(); ctx.arc(s.x * width, s.y * height, s.r, 0, Math.PI * 2); ctx.fill(); }

      const coreGrad = ctx.createRadialGradient(cx, cy, R * 0.05, cx, cy, R * 1.15);
      coreGrad.addColorStop(0, "rgba(72, 169, 214, 0.22)"); coreGrad.addColorStop(0.45, "rgba(30, 64, 115, 0.11)"); coreGrad.addColorStop(1, "rgba(7, 11, 21, 0)");
      ctx.fillStyle = coreGrad; ctx.beginPath(); ctx.arc(cx, cy, R * 1.15, 0, Math.PI * 2); ctx.fill();

      const projectedNodes = nodes.map((n) => ({ ...project(rotatePoint(n.x, n.y, n.z, rotX, rotY), cx, cy, R), rawSize: n.size }));
      for (const edge of edges) {
        const p1 = projectedNodes[edge.a], p2 = projectedNodes[edge.b];
        const depthNorm = Math.max(0, Math.min(1, ((p1.z + p2.z) * 0.5 + 1.05) / 2.1));
        ctx.strokeStyle = `rgba(203, 224, 248, ${(0.06 + depthNorm * 0.44).toFixed(3)})`;
        ctx.lineWidth = 0.45 + depthNorm * 0.95;
        ctx.beginPath(); ctx.moveTo(p1.sx, p1.sy); ctx.lineTo(p2.sx, p2.sy); ctx.stroke();
      }

      if (now - lastPulseTime > 1250) { spawnPulse(1); lastPulseTime = now; }
      for (let i = pulses.length - 1; i >= 0; i--) {
        const p = pulses[i]; p.t += p.speed;
        if (p.t >= 1) { pulses.splice(i, 1); continue; }
        const a = projectedNodes[p.reverse ? p.edge.b : p.edge.a], b = projectedNodes[p.reverse ? p.edge.a : p.edge.b];
        const hx = a.sx + (b.sx - a.sx) * p.t, hy = a.sy + (b.sy - a.sy) * p.t;
        const tailT = Math.max(0, p.t - 0.38);
        const tx = a.sx + (b.sx - a.sx) * tailT, ty = a.sy + (b.sy - a.sy) * tailT;
        const grad = ctx.createLinearGradient(tx, ty, hx, hy);
        grad.addColorStop(0, "rgba(103, 232, 249, 0)");
        grad.addColorStop(1, `rgba(125, 245, 255, ${(Math.sin(p.t * Math.PI) * 0.95).toFixed(3)})`);
        ctx.save(); ctx.strokeStyle = grad; ctx.lineWidth = 2.2; ctx.shadowColor = "#67e8f9"; ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(hx, hy); ctx.stroke(); ctx.restore();
      }

      for (const pn of projectedNodes) {
        const depthNorm = Math.max(0, Math.min(1, (pn.z + 1.05) / 2.1));
        ctx.save();
        if (depthNorm > 0.72) { ctx.shadowColor = "rgba(186, 230, 253, 0.85)"; ctx.shadowBlur = 7; }
        ctx.fillStyle = `rgba(241, 248, 255, ${(0.16 + depthNorm * 0.84).toFixed(3)})`;
        ctx.beginPath(); ctx.arc(pn.sx, pn.sy, pn.rawSize * (0.55 + depthNorm * 0.65), 0, Math.PI * 2); ctx.fill(); ctx.restore();
      }

      for (const c of comets) {
        c.angle += c.speed;
        const segs = 22, dir = c.speed >= 0 ? -1 : 1, pts = [];
        for (let s = 0; s <= segs; s++) {
          const a = c.angle + dir * (s / segs) * c.tailLen;
          const ox = Math.cos(a) * c.radius, oz = Math.sin(a) * c.radius;
          const y1 = -oz * Math.sin(c.tiltX), z1 = oz * Math.cos(c.tiltX);
          const x2 = ox * Math.cos(c.tiltZ) - y1 * Math.sin(c.tiltZ), y2 = ox * Math.sin(c.tiltZ) + y1 * Math.cos(c.tiltZ);
          pts.push(project(rotatePoint(x2, y2, z1, rotX * 0.5, rotY * 0.45), cx, cy, R));
        }
        for (let s = 0; s < segs; s++) {
          const frac = 1 - s / segs, depthNorm = Math.max(0.2, Math.min(1, (pts[s].z + 1.3) / 2.6));
          ctx.strokeStyle = `rgba(148, 233, 255, ${(frac * frac * 0.72 * depthNorm).toFixed(3)})`;
          ctx.lineWidth = 0.7 + frac * 1.6;
          ctx.beginPath(); ctx.moveTo(pts[s].sx, pts[s].sy); ctx.lineTo(pts[s + 1].sx, pts[s + 1].sy); ctx.stroke();
        }
        const head = pts[0];
        ctx.save(); ctx.shadowColor = "#67e8f9"; ctx.shadowBlur = 12;
        ctx.fillStyle = `rgba(224, 248, 255, ${Math.max(0.3, Math.min(1, (head.z + 1.3) / 2.4)).toFixed(3)})`;
        ctx.beginPath(); ctx.arc(head.sx, head.sy, 2.8 * head.scale, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      }

      const labelList = CONFIG.entities.map((ent) => {
        const cosLat = Math.cos(ent.lat);
        const rp = rotatePoint(cosLat * Math.cos(ent.lon) * 1.12, Math.sin(ent.lat) * 1.12, cosLat * Math.sin(ent.lon) * 1.12, rotX, rotY);
        return { ent, proj: project(rp, cx, cy, R) };
      }).sort((a, b) => a.proj.z - b.proj.z);

      for (const { ent, proj } of labelList) {
        const depthNorm = Math.max(0, Math.min(1, (proj.z + 1.1) / 2.2));
        const isHighlighted = (ent.id === highlightEntityId && now < highlightUntil);
        const fontSize = Math.round((11.5 + depthNorm * 2.5) * (isHighlighted ? 1.12 : 1));
        const text = ent.value ? `${ent.label} · ${ent.value}` : ent.label;
        ctx.save();
        ctx.globalAlpha = isHighlighted ? 1 : (0.32 + depthNorm * 0.68);
        ctx.shadowColor = ent.color || "#67e8f9"; ctx.shadowBlur = isHighlighted ? 18 : 9;
        ctx.fillStyle = isHighlighted ? "#ffffff" : (ent.color || "#67e8f9");
        ctx.beginPath(); ctx.arc(proj.sx, proj.sy, isHighlighted ? 4.4 : 2.8, 0, Math.PI * 2); ctx.fill();
        ctx.shadowColor = "rgba(7, 11, 21, 0.9)"; ctx.shadowBlur = 6;
        ctx.font = `${isHighlighted ? 600 : 400} ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif`;
        ctx.fillStyle = isHighlighted ? "#ffffff" : "rgba(241, 245, 249, 0.95)";
        ctx.textBaseline = "middle"; ctx.fillText(text, proj.sx + 9, proj.sy); ctx.restore();
      }
      animFrameId = requestAnimationFrame(render);
    }

    const wakeBeamEl = document.getElementById("wake-beam");
    const assistCardEl = document.getElementById("assist-card");
    const assistSourceEl = document.getElementById("assist-source-label");
    const assistTranscriptEl = document.getElementById("assist-transcript");
    const assistBodyEl = document.getElementById("assist-body");
    let hideTimer = null, typeTimer = null, demoLightsOn = 1;

    function showAssistCard({ source = "AI / LIVING ROOM", transcript = "", type = "general", payload = {} }) {
      clearTimeout(hideTimer);
      wakeBeamEl.classList.remove("firing"); void wakeBeamEl.offsetWidth; wakeBeamEl.classList.add("firing");
      spawnPulse(5);
      targetCenterYOffset = -Math.min(height * 0.085, 76); targetSphereScale = 0.92;
      assistSourceEl.textContent = source;
      clearInterval(typeTimer); assistTranscriptEl.textContent = "";
      const fullText = transcript ? `"${transcript}"` : "";
      let idx = 0;
      if (fullText) typeTimer = setInterval(() => { idx++; assistTranscriptEl.textContent = fullText.slice(0, idx); if (idx >= fullText.length) clearInterval(typeTimer); }, 26);

      if (type === "light") {
        const isOn = payload.state !== "off";
        assistBodyEl.innerHTML = `<div class="light-widget" id="live-light-widget"><div class="bulb-wrap"><div class="bulb-halo"></div><svg class="bulb-svg" viewBox="0 0 48 48" fill="none"><path class="bulb-glass" d="M24 6C15.7 6 10 12.2 10 19.6C10 24.4 12.5 28.2 15.8 31.1C17.1 32.3 18 33.8 18 35.6V37H30V35.6C30 33.8 30.9 32.3 32.2 31.1C35.5 28.2 38 24.4 38 19.6C38 12.2 32.3 6 24 6Z"/><path d="M19 40.5H29M21 44H27" stroke="rgba(148,163,184,0.75)" stroke-width="2" stroke-linecap="round"/></svg></div><div class="light-title">${payload.name || "1F 廚房主燈"}</div><div class="light-sub" id="live-light-sub">${isOn ? "Turning on..." : "Turning off..."}</div></div>`;
        setTimeout(() => {
          const w = document.getElementById("live-light-widget"), sub = document.getElementById("live-light-sub");
          if (w && isOn) { w.classList.add("is-on"); if (sub) sub.textContent = `On · ${payload.brightness ?? 93}%`; }
          else if (sub) sub.textContent = "Off";
        }, 420);
      } else if (type === "weather") {
        const daysHtml = (payload.forecast || []).map((d) => `<div class="fc-day"><div class="fc-name">${d.day}</div><div class="fc-ico">${d.icon}</div><div class="fc-val">${d.temp}</div></div>`).join("");
        assistBodyEl.innerHTML = `<div class="weather-main"><div class="weather-left"><svg class="weather-icon-lg" viewBox="0 0 64 64" fill="none"><path d="M18 40H46C51.5 40 56 35.5 56 30C56 24.8 52 20.6 46.9 20.1C45.1 13.7 39.2 9 32.2 9C23.8 9 17 15.8 17 24.2C17 24.6 17 25 17.1 25.4C12.5 26.3 9 30.3 9 35.1C9 37.8 13 40 18 40Z" fill="rgba(148,197,255,0.22)" stroke="#bae6fd" stroke-width="2.2"/><path d="M33 36L26 48H33L30 58L41 44H34L37 36H33Z" fill="#67e8f9"/></svg><div><div class="weather-cond">${payload.condition || "STORMS"}</div><div class="weather-temp">${payload.temp || "23°"}</div></div></div><div class="weather-stats"><div>H: ${payload.high || "25°"} · L: ${payload.low || "19°"}</div><div>Rain: ${payload.rain || "71%"}</div><div>Wind: ${payload.wind || "20 km/h"}</div></div></div><div class="weather-forecast">${daysHtml}</div>`;
      } else {
        assistBodyEl.innerHTML = `<div class="general-widget"><div class="general-badge">✦</div><div class="general-text">${payload.message || "Done."}</div></div>`;
      }

      assistCardEl.classList.add("visible");
      hideTimer = setTimeout(hideAssistCard, CONFIG.OVERLAY_TIMEOUT_MS);
    }

    function hideAssistCard() { clearTimeout(hideTimer); assistCardEl.classList.remove("visible"); targetCenterYOffset = 0; targetSphereScale = 1.0; }

    function triggerDemoLight() {
      demoLightsOn = demoLightsOn === 1 ? 2 : 1;
      const turningOn = demoLightsOn === 2;
      const ent = CONFIG.entities.find((e) => e.id === "switch.zhi_neng_kai_guan_4_switch");
      if (ent) { highlightEntityId = ent.id; highlightUntil = performance.now() + 4500; setTimeout(() => { ent.value = `${demoLightsOn} 開啟`; }, 550); }
      showAssistCard({ source: "AI / LIVING ROOM", transcript: turningOn ? "Turn on the kitchen lights." : "Turn off the kitchen lights.", type: "light", payload: { name: "1F 廚房主燈", state: turningOn ? "on" : "off", brightness: 93 } });
    }

    function triggerDemoWeather() {
      showAssistCard({
        source: "AI / LIVING ROOM",
        transcript: "What's the weather like today?",
        type: "weather",
        payload: { condition: "PARTLY CLOUDY", temp: "23°", high: "25°", low: "19°", rain: "71%", wind: "20 km/h", forecast: [{ day: "Sat", icon: "⛅", temp: "23°" }, { day: "Sun", icon: "🌦️", temp: "22°" }, { day: "Mon", icon: "⛅", temp: "24°" }, { day: "Tue", icon: "☀️", temp: "26°" }] }
      });
    }

    function triggerDemoGeneral() {
      highlightEntityId = "climate.dyson_9ht_tw_uga2354a"; highlightUntil = performance.now() + 4000;
      showAssistCard({ source: "AI / LIVING ROOM", transcript: "客廳和餐廳現在狀態如何？", type: "general", payload: { message: "餐廳溫度 22.6°C、濕度 64%，Dyson 空氣清淨風扇與小清除濕機運作正常。" } });
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === "1") triggerDemoLight();
      if (e.key === "2") triggerDemoWeather();
      if (e.key === "3") triggerDemoGeneral();
      if (e.key === "Escape" || e.key === "0") hideAssistCard();
    });

    initGeometry();
    resizeCanvas();
    const haClient = new HomeAssistantClient({
      url: CONFIG.HA_URL,
      token: CONFIG.HA_TOKEN,
      assistEvent: CONFIG.ASSIST_EVENT,
      onConnected: () => {
        document.getElementById("status-led").classList.add("live");
        document.getElementById("status-text").textContent = "HA LIVE CONNECTED";
      },
      onDisconnected: () => {
        document.getElementById("status-led").classList.remove("live");
        document.getElementById("status-text").textContent = "HA RECONNECTING...";
      },
      onState: (st, liveUpdate) => {
        const target = CONFIG.entities.find((e) => e.id === st.entity_id);
        if (!target) return;
        const unit = st.attributes?.unit_of_measurement || "";
        target.value = unit ? `${st.state}${unit}` : st.state;
        if (liveUpdate) { highlightEntityId = target.id; highlightUntil = performance.now() + 2500; spawnPulse(2); }
      },
      onAssist: (data) => showAssistCard(data)
    });
    haClient.connect();
    animFrameId = requestAnimationFrame(render);
  </script>
</body>
</html>
